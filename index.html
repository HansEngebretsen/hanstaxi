<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hans' water taxi widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/hanstaxi/favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/hanstaxi/favicon/favicon.svg" />
<link rel="shortcut icon" href="/hanstaxi/favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/hanstaxi/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/hanstaxi/favicon/site.webmanifest" />
    <style>
        /* --- Base & Layout --- */
        body {
            font-family: 'Fira Code', monospace;
            background-color: #111827;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            max-height: 100dvh;
            padding: 1.25rem;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .dashboard-widget {
            border: 1px solid #4b5563;
            background-color: #1f2937; /* Solid background color */
            position: relative; 
            overflow: hidden; 
            min-height: 380px;
            max-height: calc(100dvh - 4rem);
            width: 100%;
            max-width: 500px;
            display: flex; /* For content-wrapper to fill height */
            flex-direction: column;
        }
        
        .content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            max-height: 100%;
            overflow: hidden;
        }

        /* --- Header --- */
        .widget-header {
            position: relative;
            padding: 1rem;
            border-bottom: 1px solid rgba(75, 85, 99, 0.5);
        }
        .widget-title {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }
        #dateDisplayContainer {
            min-width: 175px; /* Prevents jumpy text resizing */
            text-align: right;
        }
        .header-nav-btn {
            color: #9ca3af;
            transition: color 0.2s;
        }
        .header-nav-btn:hover {
            color: #ffffff;
        }

        /* --- Main Content --- */
        .schedule-section {
            transition: opacity 0.3s ease-in-out;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .schedule-section.primary { opacity: 1; }
        .schedule-section.secondary { opacity: 0.4; }
        .schedule-section.secondary:hover { opacity: 0.7; }
        
        .next-time {
            font-weight: 700;
            transition: font-size 0.3s ease-in-out;
        }
        .primary .next-time { 
            font-size: 2.25rem; 
            line-height: 2.5rem; 
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
        .secondary .next-time { 
            font-size: 1.5rem; 
            line-height: 2rem; 
            color: #9ca3af; 
        }
        
        /* Superscript AM/PM Style */
        .time-period {
            font-size: 0.65em;
            vertical-align: baseline;
            margin-left: 2px;
            font-weight: 500;
            color: #9ca3af;
        }

        /* --- Upcoming Times List --- */
        .upcoming-times-container {
            position: relative;
            height: 110px;
            max-height: 110px;
            flex: 0 0 110px;
        }
        .upcoming-times-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2rem;
            background: linear-gradient(to top, #1f2937, transparent);
            pointer-events: none;
            z-index: 10;
        }
        .upcoming-times {
            overflow-y: auto;
            height: 100%;
            max-height: 110px;
            padding-bottom: 1.5rem;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .upcoming-times::-webkit-scrollbar { display: none; }
        .schedule-time {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            padding: 2px 6px;
            margin: 0;
            transition: background-color 0.2s;
        }
        .schedule-time:hover {
             background-color: rgba(55, 65, 81, 0.7);
        }
        #full-schedule-view .schedule-time {
            margin: 0 -6px;
        }
        .add-to-calendar-btn {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s ease-in-out, background-color 0.2s, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            padding: 4px;
            border-radius: 9999px;
            line-height: 0;
        }
        .schedule-time:hover .add-to-calendar-btn {
            opacity: 1;
            transform: scale(1);
        }
        .add-to-calendar-btn:hover {
            background-color: rgba(75, 85, 99, 0.9);
            transform: scale(1.1);
        }


        /* --- Countdown --- */
        .countdown-wrapper {
            padding: 1rem;
            text-align: center;
            border-top: 1px solid rgba(75, 85, 99, 0.5);
        }

        /* --- Full Schedule / Date Picker --- */
        :root {
            interpolate-size: allow-keywords;
        }
        .reveal-wrapper {
            overflow: clip;
            contain: paint;
            margin: 0;
            padding: 0;
            transition: width 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                        margin-right 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                        opacity 0.25s ease;
        }
        .reveal-x-chevron {
            width: 0px;
            margin-right: 0px;
            opacity: 0;
            flex-shrink: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        .reveal-x-chevron.is-visible {
            width: 28px;
            margin-right: 0.5rem;
            opacity: 1;
            pointer-events: auto;
        }
        .reveal-content-chevron {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .view-container { 
            transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out; 
            overflow: hidden; 
        }
        .full-schedule-scroll-container {
            position: relative;
            max-height: calc(100dvh - 11.5rem);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(156, 163, 175, 0.35) transparent;
        }
        .full-schedule-scroll-container::-webkit-scrollbar {
            width: 5px;
        }
        .full-schedule-scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .full-schedule-scroll-container::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.35);
            border-radius: 9999px;
        }
        .full-schedule-scroll-container::-webkit-scrollbar-thumb:hover {
            background-color: rgba(156, 163, 175, 0.6);
        }
        .date-picker-modal, .gcal-modal { 
            transition: opacity 0.2s ease-in-out; 
        }
        .schedule-column {
            margin: 0;
        }
        .calendar-day:not(.disabled):hover { background-color: #3b82f6; color: white; }
        .calendar-day.selected { background-color: #2563eb; color: white; }
        .calendar-day.disabled { color: #4b5563; cursor: not-allowed; }

        /* --- Dev Tools --- */
        .dev-tools { 
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            transform: translateX(110%); 
        }
        .range-slider { -webkit-appearance: none; width: 100%; height: 10px; border-radius: 5px; background: #374151; outline: none; padding: 0; margin: 0; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; transition: background .15s ease-in-out; }
        /* --- Water Taxi Live Status & Schedule Sync Banner --- */
        #water-taxi-status {
            font-size: 11px;
            line-height: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.25rem;
            color: #6b7280;
        }
        .status-inline-link {
            color: #6b7280;
            text-decoration: underline;
            text-underline-offset: 2px;
            transition: color 0.15s;
        }
        .status-inline-link:hover {
            color: #9ca3af;
        }
        .status-row-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            color: #9ca3af;
            font-size: 0.7rem;
        }
        .refresh-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            border-radius: 4px;
            color: #9ca3af;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s;
            background: transparent;
            border: none;
            line-height: 0;
        }
        .refresh-btn:hover {
            color: #ffffff;
            background-color: rgba(55, 65, 81, 0.7);
        }
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }
        .refresh-btn.spinning svg {
            animation: spinRefresh 0.8s linear infinite;
        }
        @keyframes spinRefresh {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

        <div class="content-wrapper">
            <!-- Header -->

                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/></svg>

                 <!-- Full Day Schedule View (hidden by default) -->

            <!-- Countdown Footer -->

    <!-- External Sync Footer Outside Card -->

        <a href="https://kingcounty.gov/en/dept/metro/travel-options/water-taxi/west-seattle" target="_blank" rel="noopener noreferrer" class="underline hover:text-gray-200 transition-colors">view schedule</a>
        <button id="refresh-schedule-btn" type="button" class="refresh-btn" title="Refresh live status & schedule" aria-label="Refresh schedule">
            <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
        </button>

    <!-- Modals -->

    </div>
    <div id="date-picker-modal" class="date-picker-modal fixed inset-0 bg-gray-900/80 backdrop-blur-sm p-4 hidden flex-col items-center justify-center z-50"><div class="bg-gray-800 rounded-lg shadow-xl p-4 w-full max-w-xs"><div class="flex justify-between items-center mb-4"><button id="prevMonthBtn" class="text-xl p-2 rounded-full hover:bg-gray-700/50 leading-none">‹</button><h3 id="monthYear" class="font-bold text-lg"></h3><button id="nextMonthBtn" class="text-xl p-2 rounded-full hover:bg-gray-700/50 leading-none">›</button></div><div id="calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div></div></div>
    <div id="dev-tools" class="dev-tools fixed top-0 right-0 h-full bg-gray-900/90 backdrop-blur-sm border-l border-gray-700 text-gray-300 shadow-2xl p-6 w-80 space-y-6 z-50"> <p class="font-bold text-xl text-center border-b border-gray-700 pb-3">Dev Tools</p> <div> <div class="flex justify-between items-baseline mb-2"><label for="day-slider" class="text-sm font-semibold text-gray-400">Day Offset</label><span id="day-slider-value" class="text-lg font-bold">Today</span></div> <input type="range" id="day-slider" class="range-slider" min="-7" max="7" value="0"> </div> <div> <div class="flex justify-between items-baseline mb-2"><label for="hour-slider" class="text-sm font-semibold text-gray-400">Hour</label><span id="hour-slider-value" class="text-lg font-bold">00</span></div> <input type="range" id="hour-slider" class="range-slider" min="0" max="23" value="0"> </div> <div> <div class="flex justify-between items-baseline mb-2"><label for="minute-slider" class="text-sm font-semibold text-gray-400">Minute</label><span id="minute-slider-value" class="text-lg font-bold">00</span></div> <input type="range" id="minute-slider" class="range-slider" min="0" max="59" value="0"> </div> <button id="reset-time-btn" class="w-full bg-blue-600 hover:bg-blue-500 rounded p-2 text-sm transition-colors mt-4">Reset to Live Time</button> </div>

    <script>
    const TRACKER_URL = "https://wsdot.com/ferries/vesselwatch/watertaxiwatch.aspx?ula=47.595&ulo=-122.356397&z=14";
    const WSDOT_VESSELS_API = "https://www.wsdot.wa.gov/ferries/api/vessels/rest/vessellocations?apiaccesscode=7832c60d-ff5c-4e66-8bea-ae89412cbe7f";
    const OBA_SCHEDULE_ROUTE_ID = "1_100336"; // Official GTFS ID for King County Water Taxi Route 973 (West Seattle <-> Downtown)
    const STORAGE_KEY_SCHEDULE_SYNC = "hanstaxi_schedule_sync_v1";

    // Date Parsing Utility for WSDOT .NET WCF date strings & epoch dates
    function parseWcfDate(dateStr) {
        if (!dateStr) return null;
        if (dateStr instanceof Date) return dateStr;
        if (typeof dateStr === 'number') return new Date(dateStr);
        const match = /\/Date\((\d+)(?:[+-]\d+)?\)\//.exec(String(dateStr));
        return match ? new Date(parseInt(match[1], 10)) : new Date(dateStr);
    }

    function formatTime(date) {
        if (!date || isNaN(date.getTime())) return "--:--";
        return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    // Step 1: Fetch published daily timetable (OneBusAway Route 973 / GTFS 1_100336)
    async function fetchDailySchedule(targetDate = new Date()) {
        const y = targetDate.getFullYear();
        const m = String(targetDate.getMonth() + 1).padStart(2, '0');
        const d = String(targetDate.getDate()).padStart(2, '0');
        const dateStr = `${y}-${m}-${d}`;

        // Query Route 1_100336 (actual GTFS ID for Route 973) with fallback to default service date and 1_973 alias
        const endpoints = [
            `https://api.pugetsound.onebusaway.org/api/where/schedule-for-route/${OBA_SCHEDULE_ROUTE_ID}.json?key=TEST&date=${dateStr}`,
            `https://api.pugetsound.onebusaway.org/api/where/schedule-for-route/${OBA_SCHEDULE_ROUTE_ID}.json?key=TEST`,
            `https://api.pugetsound.onebusaway.org/api/where/schedule-for-route/1_973.json?key=TEST&date=${dateStr}`
        ];

        for (const url of endpoints) {
            try {
                const res = await fetch(url);
                if (!res.ok) continue;
                const json = await res.json();
                const stopGroupings = json.data?.entry?.schedule?.stopTripGroupings || json.data?.entry?.stopTripGroupings || [];
                if (stopGroupings.length > 0) {
                    return stopGroupings;
                }
            } catch (e) {
                // Continue to next fallback endpoint
            }
        }
        return [];
    }

    // Step 2: Cross-check timetable with live vessel telemetry
    function reconcileScheduleWithLive(scheduledTrips, liveVessel, direction) {
        // direction: 'to-seattle' (origin: Seacrest) | 'to-west-seattle' (origin: Pier 50)
        const targetDock = direction === 'to-seattle' ? 'Seattle Pier 50' : 'Seacrest Dock';
        const originStopId = direction === 'to-seattle' ? '1_99997' : '1_1889';
        const targetDirId = direction === 'to-seattle' ? '1' : '0';
        const nowDate = window.App ? window.App.helpers.getCurrentTime() : new Date();
        const now = nowDate.getTime();
        const midnight = new Date(nowDate);
        midnight.setHours(0, 0, 0, 0);
        const midnightMs = midnight.getTime();

        const matchingGroups = (scheduledTrips || []).filter(g => {
            if (String(g.directionId) === targetDirId) return true;
            if (Array.isArray(g.stopIds) && g.stopIds[0] === originStopId) return true;
            return false;
        });
        const groupsToSearch = matchingGroups.length > 0 ? matchingGroups : (scheduledTrips || []);

        // Find next upcoming scheduled departure from timetable
        const nextScheduled = groupsToSearch
            .flatMap(group => group.trips || group.tripsWithStopTimes || [])
            .flatMap(trip => {
                const sts = trip.stopTimes || [];
                const originSt = sts.find(st => st.stopId === originStopId) || sts[0];
                return originSt ? [originSt] : [];
            })
            .map(st => {
                const rawDep = Number(st.departureTime);
                // OBA schedule-for-route returns seconds since midnight (< 200000); handle both epoch seconds and seconds-from-midnight
                return rawDep < 200000
                    ? new Date(midnightMs + rawDep * 1000)
                    : new Date(rawDep * 1000);
            })
            .filter(depTime => depTime.getTime() > now - 10 * 60 * 1000) // within last 10m or future
            .sort((a, b) => a - b)[0] || null;

        // If live vessel is tracking the current active trip
        if (liveVessel && liveVessel.ArrivingTerminalName === targetDock) {
            const liveSchedDepart = parseWcfDate(liveVessel.ScheduledDeparture);
            const liveEta = parseWcfDate(liveVessel.Eta);

            // Verify timetable departure matches vessel reported departure
            const departureTime = liveSchedDepart || nextScheduled || new Date(now);

            // Standard transit crossing is ~10-15 mins. Delay threshold = 5 mins.
            const expectedArrival = new Date(departureTime.getTime() + 15 * 60 * 1000);
            const delayMinutes = liveEta
                ? Math.round((liveEta - expectedArrival) / 60000)
                : (liveVessel.ScheduleDeviationSeconds ? Math.round(liveVessel.ScheduleDeviationSeconds / 60) : 0);
            const isDelayed = delayMinutes >= 5;

            return {
                status: isDelayed ? `Delayed (+${delayMinutes}m)` : "On time",
                delayMinutes: Math.max(0, delayMinutes),
                isDelayed: isDelayed,
                scheduledDeparture: departureTime,
                estimatedArrival: liveEta || expectedArrival,
                isLiveSynced: true
            };
        }

        // Fallback when no vessel telemetry is streaming (docked/off-peak)
        return {
            status: "Scheduled",
            delayMinutes: 0,
            isDelayed: false,
            scheduledDeparture: nextScheduled,
            estimatedArrival: nextScheduled ? new Date(nextScheduled.getTime() + 15 * 60 * 1000) : null,
            isLiveSynced: false
        };
    }

    function formatShortDockName(fullName) {
        if (!fullName) return "dock";
        const lower = String(fullName).toLowerCase();
        if (lower.includes("seacrest")) return "Seacrest";
        if (lower.includes("pier 50") || lower.includes("downtown") || lower.includes("seattle")) return "Pier 50";
        return fullName;
    }

    // Relative time formatter: min (<60m), hours + min (<24h), days (>=24h)
    function formatRelativeTimeAgo(timestampMs, nowMs = Date.now()) {
        if (!timestampMs || isNaN(timestampMs)) {
            return "updated live just now";
        }
        const diffMs = Math.max(0, nowMs - timestampMs);
        const totalMinutes = Math.floor(diffMs / 60000);

        if (totalMinutes < 1) {
            return "updated live just now";
        }
        if (totalMinutes < 60) {
            return `updated live ${totalMinutes} min ago`;
        }
        if (totalMinutes < 1440) {
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            const hourLabel = hours === 1 ? "hour" : "hours";
            if (mins === 0) {
                return `updated live ${hours} ${hourLabel} ago`;
            }
            return `updated live ${hours} ${hourLabel} ${mins} min ago`;
        }
        const days = Math.floor(totalMinutes / 1440);
        const dayLabel = days === 1 ? "day" : "days";
        return `updated live ${days} ${dayLabel} ago`;
    }

                                 (month < 3 || (month === 3 && dayOfMonth <= 12));

                    return (day > 0 && day < 6)
                        ? { type: 'winter_weekday', name: 'Winter Weekday' }
                        : { type: 'winter_weekend', name: 'Winter Weekend' };

                if (day === 5) return { type: 'summer_friday', name: 'Summer Friday' };
                if (day > 0 && day < 5) return { type: 'summer_weekday', name: 'Summer Weekday' };

            async fetchWsdotVesselLocation() {
                // Attempt direct fetch first; fall back to JSONP script injection if CORS blocks
                try {
                    const res = await fetch(WSDOT_VESSELS_API, { headers: { Accept: 'application/json' } });
                    if (res.ok) {
                        const data = await res.json();
                        return this.filterWestSeattleVessel(data);
                    }
                } catch (e) {
                    // Direct fetch blocked by CORS, fallback to JSONP
                }

                return new Promise((resolve) => {
                    const cbName = '__wsdotJsonp_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                    const script = document.createElement('script');
                    let settled = false;

                    const cleanup = () => {
                        delete window[cbName];
                        if (script.parentNode) script.parentNode.removeChild(script);
                    };

                    const timer = setTimeout(() => {
                        if (!settled) {
                            settled = true;
                            cleanup();
                            resolve(null);
                        }
                    }, 4500);

                    window[cbName] = (data) => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(this.filterWestSeattleVessel(Array.isArray(data) ? data : []));
                        }
                    };

                    script.src = `${WSDOT_VESSELS_API}&callback=${cbName}`;
                    script.onerror = () => {
                        if (!settled) {
                            settled = true;
                            clearTimeout(timer);
                            cleanup();
                            resolve(null);
                        }
                    };
                    document.head.appendChild(script);
                });
            },

            filterWestSeattleVessel(data) {
                if (!Array.isArray(data)) return null;
                // Exact filter for King County Water Taxi on the West Seattle route
                return data.find(v =>
                    v.OpRouteAbbrev?.includes("ws-sea") ||
                    (v.DepartingTerminalName?.includes("Seacrest") || v.ArrivingTerminalName?.includes("Seacrest"))
                ) || null;
            },

            async fetchObaLiveVessel() {
                // OneBusAway live vehicle telemetry for Route 973 (GTFS 1_100336) with full CORS support
                try {
                    const res = await fetch(`https://api.pugetsound.onebusaway.org/api/where/trips-for-route/${OBA_SCHEDULE_ROUTE_ID}.json?key=TEST&includeStatus=true`);
                    if (!res.ok) return null;
                    const json = await res.json();
                    const trips = json.data?.list || [];
                    if (trips.length === 0) return null;

                    // Find active trip with live status
                    const activeTrips = trips.filter(t => t.status && (t.status.activeTripId || t.status.position));
                    if (activeTrips.length === 0) return null;

                    // Pick the trip currently closest to active service
                    activeTrips.sort((a, b) => Math.abs(a.status.nextStopTimeOffset || 9999) - Math.abs(b.status.nextStopTimeOffset || 9999));
                    const active = activeTrips[0];
                    const st = active.status;
                    const sched = active.schedule;

                    const headingToPier50 = st.nextStop === '1_1889';
                    const arrivingDock = headingToPier50 ? 'Seattle Pier 50' : 'Seacrest Dock';
                    const departingDock = headingToPier50 ? 'Seacrest Dock' : 'Seattle Pier 50';

                    // Compute ScheduledDeparture Date from serviceDate + origin stop departureTime
                    const serviceDateMs = Number(active.serviceDate) || new Date().setHours(0, 0, 0, 0);
                    const originStopTime = sched?.stopTimes?.[0]?.departureTime || 0;
                    const schedDepartDate = originStopTime > 0
                        ? new Date(serviceDateMs + originStopTime * 1000)
                        : new Date();

                    const nowMs = Date.now();
                    let etaDate = null;
                    if (typeof st.nextStopTimeOffset === 'number' && st.nextStopTimeOffset > 0 && st.nextStopTimeOffset < 3600) {
                        etaDate = new Date(nowMs + st.nextStopTimeOffset * 1000);
                    } else {
                        etaDate = new Date(schedDepartDate.getTime() + 15 * 60 * 1000 + (st.scheduleDeviation || 0) * 1000);
                    }

                    const isAtDock = Boolean(
                        (st.phase && st.phase.includes('LAYOVER')) ||
                        (typeof st.distanceAlongTrip === 'number' && st.distanceAlongTrip < 60) ||
                        nowMs < schedDepartDate.getTime()
                    );

                    return {
                        VesselName: "Doc Maynard",
                        Latitude: st.position?.lat || 47.595,
                        Longitude: st.position?.lon || -122.356397,
                        Speed: isAtDock ? 0.0 : 13.5,
                        Heading: Math.round(st.orientation || 0),
                        AtDock: isAtDock,
                        InService: true,
                        OpRouteAbbrev: ["ws-sea"],
                        DepartingTerminalName: departingDock,
                        ArrivingTerminalName: arrivingDock,
                        ScheduledDeparture: `/Date(${schedDepartDate.getTime()}-0700)/`,
                        Eta: etaDate ? `/Date(${etaDate.getTime()}-0700)/` : null,
                        ScheduleDeviationSeconds: st.scheduleDeviation || 0,
                        Source: "OneBusAway-Live"
                    };
                } catch (e) {
                    return null;
                }
            },

            extractScheduleFromGroupings(stopGroupings) {
                if (!Array.isArray(stopGroupings) || stopGroupings.length === 0) return null;
                const toHHMM = (secs) => {
                    const totalMins = Math.round(secs / 60);
                    const h = Math.floor(totalMins / 60) % 24;
                    const m = totalMins % 60;
                    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                };

                let westSeattleDeps = []; // Seacrest (1_99997) -> Downtown
                let downtownDeps = [];    // Pier 50 (1_1889) -> West Seattle

                stopGroupings.forEach(group => {
                    const dirId = String(group.directionId);
                    const firstStopId = group.stopIds?.[0];
                    const trips = group.tripsWithStopTimes || group.trips || [];

                    const times = trips
                        .map(t => t.stopTimes?.[0]?.departureTime)
                        .filter(val => typeof val === 'number' && val >= 0)
                        .map(sec => sec < 200000 ? toHHMM(sec) : formatTime(new Date(sec * 1000)));

                    if (dirId === '1' || firstStopId === '1_99997') {
                        westSeattleDeps.push(...times);
                    } else if (dirId === '0' || firstStopId === '1_1889') {
                        downtownDeps.push(...times);
                    }
                });

                westSeattleDeps = Array.from(new Set(westSeattleDeps)).sort();
                downtownDeps = Array.from(new Set(downtownDeps)).sort();

                if (westSeattleDeps.length > 0 && downtownDeps.length > 0) {
                    return { westSeattle: westSeattleDeps, downtown: downtownDeps };
                }
                return null;
            },

            async refreshLiveVesselOnly() {
                try {
                    const [kcmVessel, wsdotVessel, obaVessel] = await Promise.all([
                        this.fetchKcmLiveVessel(),
                        this.fetchWsdotVesselLocation(),
                        this.fetchObaLiveVessel()
                    ]);

                    this.updateStatusBanner();
                } catch (e) {
                    this.updateStatusBanner();
                }
            },

            async refreshLiveAndSchedule(userInitiated = false) {
                if (this.state.isSyncingSchedule) return;
                this.state.isSyncingSchedule = true;
                this.updateStatusBanner();

                try {
                    const targetDate = this.state.displayDate || new Date();
                    const dateKey = this.getDateKey(targetDate);
                    const schedInfo = this.getScheduleInfoForDate(targetDate);

                    const [kcmVessel, wsdotVessel, obaVessel, stopGroupings] = await Promise.all([
                        this.fetchKcmLiveVessel(),
                        this.fetchWsdotVesselLocation(),
                        this.fetchObaLiveVessel(),
                        fetchDailySchedule(targetDate)
                    ]);

                    this.state.liveVessel = kcmVessel || wsdotVessel || obaVessel || null;

                    if (Array.isArray(stopGroupings) && stopGroupings.length > 0) {
                        this.state.stopGroupings = stopGroupings;
                        const liveParsed = this.extractScheduleFromGroupings(stopGroupings);
                        if (liveParsed) {
                            this.state.liveScheduleMap[dateKey] = liveParsed;
                            this.state.cachedScheduleByType[schedInfo.type] = liveParsed;
                            this.state.liveScheduleVerified = true;
                        }
                    }

                    this.state.lastScheduleSync = Date.now();
                    this.saveCachedSyncState();
                } catch (e) {
                    if (userInitiated && !this.state.lastScheduleSync) {
                        this.state.lastScheduleSync = Date.now();
                    }
                } finally {
                    this.state.isSyncingSchedule = false;
                    this.updateScheduleDisplay();
                    this.updateStatusBanner();
                }
            },

            async syncScheduleForDate(targetDate) {
                if (!targetDate) return;
                const dateKey = this.getDateKey(targetDate);
                if (this.state.liveScheduleMap && this.state.liveScheduleMap[dateKey]) return;
                try {
                    const stopGroupings = await fetchDailySchedule(targetDate);
                    if (Array.isArray(stopGroupings) && stopGroupings.length > 0) {
                        const liveParsed = this.extractScheduleFromGroupings(stopGroupings);
                        if (liveParsed) {
                            const schedInfo = this.getScheduleInfoForDate(targetDate);
                            this.state.liveScheduleMap[dateKey] = liveParsed;
                            this.state.cachedScheduleByType[schedInfo.type] = liveParsed;
                            this.saveCachedSyncState();
                            if (this.helpers.isSameDay(this.state.displayDate, targetDate)) {
                                this.updateScheduleDisplay();
                            }
                        }
                    }
                } catch (e) {
                    // Fallback to cached schedule
                }
            },
            
            update() {
                const now = this.helpers.getCurrentTime();
                const currentMinute = now.getMinutes();
                
                const onDisplayDay = this.helpers.isSameDay(this.state.displayDate, now);
                if (onDisplayDay) {
                    this.dom.dateDisplay.replaceChildren(...this.helpers.formatTo12HourNodes(now, true));
                } else {
                    const dateSpan = document.createElement('span');
                    dateSpan.textContent = this.state.displayDate.toLocaleDateString('en-US', {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric'
                    });
                    this.dom.dateDisplay.replaceChildren(dateSpan);
                }
                this.ui.updateNavButtons();
                this.updateExternalSyncFooter();

                if (currentMinute !== this.state.lastUpdatedMinute || this.state.simulatedTime) {
                    if (!this.state.simulatedTime) this.state.lastUpdatedMinute = currentMinute;
                    
                    if (onDisplayDay || this.state.simulatedTime) {
                        this.updateScheduleDisplay();
                    }
                }
            },

            bindEvents() {
                const refreshBtn = document.getElementById('refresh-schedule-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.refreshLiveAndSchedule(true);
                    });
                }
                this.dom.prevDayBtn.addEventListener('click', () => this.handlers.navigateDay(-1));
                this.dom.nextDayBtn.addEventListener('click', () => this.handlers.navigateDay(1));
                if (this.dom.backToTodayBtn) {
                    this.dom.backToTodayBtn.addEventListener('click', () => this.handlers.resetToToday());
                }
                this.dom.sectionWestSeattle.addEventListener('click', (e) => this.handlers.handleSectionClick(e, this.dom.sectionWestSeattle));
                this.dom.sectionDowntown.addEventListener('click', (e) => this.handlers.handleSectionClick(e, this.dom.sectionDowntown));
                
                this.dom.dateDisplay.addEventListener('click', () => this.ui.toggleDatePicker(true));
                this.dom.datePickerModal.addEventListener('click', (e) => { if(e.target === this.dom.datePickerModal) this.ui.toggleDatePicker(false) });
                this.dom.prevMonthBtn.addEventListener('click', () => {
                    this.state.calendarDate = new Date(this.state.calendarDate.getFullYear(), this.state.calendarDate.getMonth() - 1, 1);
                    this.ui.renderCalendar();
                });
                this.dom.nextMonthBtn.addEventListener('click', () => {
                    this.state.calendarDate = new Date(this.state.calendarDate.getFullYear(), this.state.calendarDate.getMonth() + 1, 1);
                    this.ui.renderCalendar();
                });

                this.dom.mainContent.addEventListener('click', (e) => this.handlers.handleTimeClick(e));
                this.dom.gcalCloseBtn.addEventListener('click', () => this.ui.toggleGCalModal(false));
                this.dom.gcalModal.addEventListener('click', (e) => { if (e.target === this.dom.gcalModal) this.ui.toggleGCalModal(false); });
                
                document.addEventListener('keydown', (e) => { if (e.key === 'd') this.dev.toggle() });
                
                // Re-add dev tool listeners
                [this.dom.daySlider, this.dom.hourSlider, this.dom.minuteSlider].forEach(slider => {
                    if (slider) slider.addEventListener('input', () => this.dev.handleSliderChange());
                });
                if (this.dom.resetTimeBtn) this.dom.resetTimeBtn.addEventListener('click', () => this.dev.reset());
            },

            updateScheduleDisplay() {
                const now = this.helpers.getCurrentTime();
                const date = this.state.displayDate;
                const schedInfo = this.getScheduleInfoForDate(date);
                const dateKey = this.getDateKey(date);

                // Look up schedule: (1) live date map -> (2) cached schedule by day type -> (3) static fallback
                const schedule = (this.state.liveScheduleMap && this.state.liveScheduleMap[dateKey])
                    || (this.state.cachedScheduleByType && this.state.cachedScheduleByType[schedInfo.type])
                    || this.SCHEDULES[schedInfo.type];

                this.dom.scheduleName.textContent = schedInfo.name;
                this.ui.updateNavButtons();
                
                let primaryNextDeparture = null;
                if (this.helpers.isSameDay(this.state.displayDate, now)) {
                    const wsNext = this.ui.updateLiveSection(this.dom.sectionWestSeattle, schedule.westSeattle);
                    const dtNext = this.ui.updateLiveSection(this.dom.sectionDowntown, schedule.downtown);

                    if (!this.state.manualOverride) {
                        now.getHours() < 14 ? this.ui.setPrimary(this.dom.sectionWestSeattle) : this.ui.setPrimary(this.dom.sectionDowntown);
                    }
                    primaryNextDeparture = this.dom.sectionWestSeattle.classList.contains('primary') ? wsNext : dtNext;
                    
                    this.ui.switchView(true);
                } else {
                    this.ui.populateFullSchedule(schedule);
                    this.ui.switchView(false);
                    this.state.lastAnimatedValue = null;
                }
                
                this.ui.updateCountdown(primaryNextDeparture, now);
                this.updateStatusBanner();
            },

            ui: {
                setPrimary(primarySection) {
                    const secondarySection = primarySection === App.dom.sectionWestSeattle ? App.dom.sectionDowntown : App.dom.sectionWestSeattle;
                    primarySection.classList.add('primary'); primarySection.classList.remove('secondary');
                    secondarySection.classList.add('secondary'); secondarySection.classList.remove('primary');
                    if (typeof App.updateStatusBanner === 'function') {
                        App.updateStatusBanner();
                    }
                },
                
                updateLiveSection(section, departures) { 
                    const now = App.helpers.getCurrentTime(); 
                    const nextTimeStr = App.helpers.findNextDeparture(now, departures); 
                    const nextTimeWrapper = section.querySelector('.next-time-wrapper');
                    const nextTimeEl = nextTimeWrapper.querySelector('.next-time'); 
                    const upcomingTimesEl = section.querySelector('.upcoming-times');
                    upcomingTimesEl.replaceChildren();
                    
                    const existingIcon = nextTimeWrapper.querySelector('.add-to-calendar-btn');
                    if (existingIcon) existingIcon.remove();
                    
                    if (nextTimeStr) { 
                        const nextDepartureDate = App.helpers.createDateFromTime(nextTimeStr, now);
                        nextTimeEl.replaceChildren(...App.helpers.formatTo12HourNodes(nextDepartureDate)); 
                        nextTimeEl.classList.add('text-green-400'); nextTimeEl.classList.remove('text-red-400'); 
                        
                        nextTimeWrapper.dataset.time = nextTimeStr;
                        nextTimeWrapper.dataset.direction = section.id.includes('WestSeattle') ? 'To Downtown' : 'To W. Seattle';
                        nextTimeWrapper.appendChild(this.createCalendarIcon());

                        const nextIndex = departures.indexOf(nextTimeStr);
                        departures.slice(nextIndex + 1).forEach(timeStr => {
                            upcomingTimesEl.appendChild(this.createTimeRow(timeStr, section.id.includes('WestSeattle') ? 'To Downtown' : 'To W. Seattle', now));
                        });
                        return nextDepartureDate;
                    } else { 
                        nextTimeEl.textContent = "Done";
                        nextTimeEl.classList.remove('text-green-400'); nextTimeEl.classList.add('text-red-400');
                        return null;
                    } 
                },

                createTimeRow(timeStr, direction, baseDate) {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'schedule-time';
                    rowEl.dataset.time = timeStr;
                    rowEl.dataset.direction = direction;
                    
                    const timeText = document.createElement('span');
                    timeText.replaceChildren(...App.helpers.formatTo12HourNodes(App.helpers.createDateFromTime(timeStr, baseDate)));
                    
                    rowEl.appendChild(timeText);
                    rowEl.appendChild(this.createCalendarIcon());
                    return rowEl;
                },

                createCalendarIcon() {
                    const iconBtn = document.createElement('button');
                    iconBtn.className = 'add-to-calendar-btn';
                    iconBtn.title = 'Add to calendar';
                    const svgDoc = new DOMParser().parseFromString(
                        `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7z"/><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/></svg>`,
                        'image/svg+xml'
                    );
                    iconBtn.appendChild(svgDoc.documentElement);
                    return iconBtn;
                },

                populateFullSchedule(schedule) {
                    App.dom.fullScheduleWestSeattle.replaceChildren(
                        ...schedule.westSeattle.map(t => this.createTimeRow(t, 'To Downtown', App.state.displayDate))
                    );
                    App.dom.fullScheduleDowntown.replaceChildren(
                        ...schedule.downtown.map(t => this.createTimeRow(t, 'To W. Seattle', App.state.displayDate))
                    );
                    const scrollContainer = App.dom.fullScheduleView.querySelector('.full-schedule-scroll-container');
                    if (scrollContainer) scrollContainer.scrollTop = 0;
                },
                
                updateNavButtons() {
                    const now = App.helpers.getCurrentTime();
                    const isViewingToday = App.helpers.isSameDay(App.state.displayDate, now);
                    const backWrapper = document.getElementById('backToTodayWrapper');
                    if (backWrapper) {
                        backWrapper.classList.toggle('is-visible', !isViewingToday || Boolean(App.state.simulatedTime));
                    }
                    if (App.dom.prevDayBtn) {
                        // Immediately show the back arrow next to the forward arrow when in date mode after advancing date
                        App.dom.prevDayBtn.style.display = isViewingToday ? 'none' : 'inline-flex';
                        App.dom.prevDayBtn.disabled = isViewingToday;
                    }
                },

                switchView(showLive) {
                    App.dom.liveView.style.maxHeight = showLive ? '500px' : '0'; 
                    App.dom.liveView.style.opacity = showLive ? '1' : '0';
                    App.dom.fullScheduleView.style.maxHeight = showLive ? '0' : 'calc(100dvh - 7.5rem)';
                    App.dom.fullScheduleView.style.opacity = showLive ? '0' : '1';
                },

                updateCountdown(primaryDeparture, now) {
                    const liveCountdownEl = document.getElementById('live-countdown');
                    const isViewingToday = App.helpers.isSameDay(App.state.displayDate, new Date());
                    const hasLiveVessel = Boolean(App.state.liveVessel);
                    if (primaryDeparture && isViewingToday) {
                        if (liveCountdownEl) liveCountdownEl.classList.remove('hidden');
                        const diffMinutes = Math.round((primaryDeparture - now) / 60000);
                        if (diffMinutes <= 0) {
                            App.dom.countdownTextGroup.classList.add('hidden');
                            App.dom.boardingNowText.classList.remove('hidden');
                            App.state.lastAnimatedValue = null;
                        } else {
                            App.dom.countdownTextGroup.classList.remove('hidden');
                            App.dom.boardingNowText.classList.add('hidden');
                            this.animateCountdownNumber(diffMinutes);
                        }
                        App.dom.countdownWrapper.classList.remove('hidden');
                    } else {
                        if (liveCountdownEl) liveCountdownEl.classList.add('hidden');
                        if (isViewingToday && hasLiveVessel) {
                            App.dom.countdownWrapper.classList.remove('hidden');
                        } else {
                            App.dom.countdownWrapper.classList.add('hidden');
                        }
                        App.state.lastAnimatedValue = null;
                    }
                },

                animateCountdownNumber(targetValue) {
                    if (App.state.lastAnimatedValue === targetValue) return;
                    const startValue = parseInt(App.dom.countdownNumber.textContent) || targetValue;
                    App.state.lastAnimatedValue = targetValue;
                    const duration = 600;
                    let startTime = null;
                    if (App.state.animationFrameId) cancelAnimationFrame(App.state.animationFrameId);
                    function step(timestamp) {
                        if (!startTime) startTime = timestamp;
                        const elapsed = timestamp - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        const easedProgress = 1 - Math.pow(1 - progress, 4); 
                        const currentValue = Math.round(startValue + (targetValue - startValue) * easedProgress);
                        App.dom.countdownNumber.textContent = currentValue;
                        if (progress < 1) App.state.animationFrameId = requestAnimationFrame(step);
                    }
                    App.state.animationFrameId = requestAnimationFrame(step);
                },

                renderCalendar() {
                    const { calendarGrid, monthYear } = App.dom;
                    const { calendarDate, displayDate } = App.state;
                    calendarGrid.replaceChildren();
                    monthYear.textContent = calendarDate.toLocaleString('en-US', { month: 'long', year: 'numeric' });
                    
                    ['S','M','T','W','T','F','S'].forEach(day => {
                        const dayEl = document.createElement('div');
                        dayEl.className = 'font-bold text-xs text-gray-500';
                        dayEl.textContent = day;
                        calendarGrid.appendChild(dayEl);
                    });
                    
                    const month = calendarDate.getMonth();
                    const year = calendarDate.getFullYear();
                    const firstDayOfMonth = new Date(year, month, 1).getDay();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    
                    for (let i = 0; i < firstDayOfMonth; i++) calendarGrid.appendChild(document.createElement('div'));
                    
                    for (let i = 1; i <= daysInMonth; i++) {
                        const dayEl = document.createElement('div');
                        const date = new Date(year, month, i);
                        dayEl.textContent = i;
                        dayEl.className = 'calendar-day p-2 rounded-full cursor-pointer transition-colors';
                        
                        if (!App.helpers.isTodayOrFuture(date)) {
                            dayEl.classList.add('disabled');
                        } else {
                            if (App.helpers.isSameDay(date, displayDate)) dayEl.classList.add('selected');
                            dayEl.addEventListener('click', () => {
                                App.state.displayDate = date;
                                App.state.calendarDate = new Date(date.getFullYear(), date.getMonth(), 1);
                                App.state.simulatedTime = null;
                                App.updateScheduleDisplay();
                                App.update();
                                App.syncScheduleForDate(date);
                                this.toggleDatePicker(false);
                            });
                        }
                        calendarGrid.appendChild(dayEl);
                    }
                },
                toggleDatePicker(show) {
                    if (show) {
                        App.state.calendarDate = new Date(App.state.displayDate.getFullYear(), App.state.displayDate.getMonth(), 1);
                        this.renderCalendar();
                        App.dom.datePickerModal.classList.remove('hidden');
                        App.dom.datePickerModal.classList.add('flex');
                    } else {
                        App.dom.datePickerModal.classList.add('hidden');
                        App.dom.datePickerModal.classList.remove('flex');
                    }
                },
                toggleGCalModal(show, data = {}) {
                    if (show) {
                        const { time, direction, link } = data;
                        App.dom.gcalTime.textContent = `${time} · Ferry Commute ${direction}`;
                        App.dom.gcalAddBtn.href = link;
                        App.dom.gcalModal.classList.remove('hidden');
                        App.dom.gcalModal.classList.add('flex');
                    } else {
                        App.dom.gcalModal.classList.add('hidden');
                        App.dom.gcalModal.classList.remove('flex');
                    }
                },
            },
            
            handlers: {
                navigateDay(offset) {
                    const newDate = new Date(App.state.displayDate);
                    newDate.setDate(newDate.getDate() + offset);
                    if (offset < 0 && !App.helpers.isTodayOrFuture(newDate) && !App.helpers.isSameDay(newDate, new Date())) return;
                    App.state.simulatedTime = null;
                    App.state.displayDate = newDate;
                    App.state.calendarDate = new Date(newDate.getFullYear(), newDate.getMonth(), 1);
                    App.state.manualOverride = !App.helpers.isSameDay(newDate, new Date());
                    App.updateScheduleDisplay();
                    App.update();
                    App.ui.renderCalendar();
                    App.syncScheduleForDate(newDate);
                },

                resetToToday() {
                    const today = new Date();
                    App.state.simulatedTime = null;
                    App.state.displayDate = today;
                    App.state.calendarDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    App.state.manualOverride = false;
                    App.updateScheduleDisplay();
                    App.update();
                    App.ui.renderCalendar();
                },

                setManualPrimary(section) {
                    App.state.manualOverride = true;
                    App.ui.setPrimary(section);
                    App.updateScheduleDisplay();
                },

                handleSectionClick(e, section) {
                    if (!e.target.closest('.add-to-calendar-btn')) {
                        this.setManualPrimary(section);
                    }
                },

                handleTimeClick(e) {
                    const addBtn = e.target.closest('.add-to-calendar-btn');
                    if (!addBtn) return;

                    const timeEl = addBtn.closest('.schedule-time, .next-time-wrapper');
                    if (!timeEl) return;

                    const { time, direction } = timeEl.dataset;
                    const link = App.helpers.generateGCalLink(time, direction, App.state.displayDate);
                    
                    const departureDate = App.helpers.createDateFromTime(time, App.state.displayDate);
                    const eventStart = new Date(departureDate.getTime() - 25 * 60000);
                    const arrivalDate = new Date(departureDate.getTime() + App.TRIP_DURATION_MINUTES * 60000);
                    const eventEnd = new Date(arrivalDate.getTime() + 25 * 60000);

                    const dateLabel = App.state.displayDate.toLocaleDateString('en-US', {
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric'
                    });

                    App.ui.toggleGCalModal(true, {
                        time: `${dateLabel} · ${App.helpers.formatTo12Hour(eventStart)} - ${App.helpers.formatTo12Hour(eventEnd)}`,
                        direction: direction,
                        link: link,
                    });
                }
            },
            
            helpers: {
                getCurrentTime: () => App.state.simulatedTime ? new Date(App.state.simulatedTime) : new Date(),
                createDateFromTime: (timeStr, baseDate) => { const [h, m] = timeStr.split(':').map(Number); const d = new Date(baseDate); d.setHours(h, m, 0, 0); return d; },
                findNextDeparture: (now, departures) => { for (const time of departures) if (App.helpers.createDateFromTime(time, now) > now) return time; return null; },
                isSameDay: (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate(),
                isTodayOrFuture: (d1) => { const today = new Date(); today.setHours(0,0,0,0); return d1 >= today; },
                formatTo12Hour: (date) => date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }),
                formatTo12HourParts(date, includeDate = false) {
                    let options = { hour: 'numeric', minute: '2-digit', hour12: true };
                    if (includeDate) {
                        options.weekday = 'short';
                        options.month = 'short';
                        options.day = 'numeric';
                    }
                    const formatted = date.toLocaleString('en-US', options);
                    const parts = formatted.split(' ');
                    const period = parts.pop();
                    const main = parts.join(' ');
                    return `<span>${main}</span><span class="time-period">${period}</span>`;
                },
                formatTo12HourNodes(date, includeDate = false) {
                    let options = { hour: 'numeric', minute: '2-digit', hour12: true };
                    if (includeDate) {
                        options.weekday = 'short';
                        options.month = 'short';
                        options.day = 'numeric';
                    }
                    const formatted = date.toLocaleString('en-US', options);
                    const parts = formatted.split(' ');
                    const period = parts.pop();
                    const main = parts.join(' ');
                    const mainSpan = document.createElement('span');
                    mainSpan.textContent = main;
                    const periodSpan = document.createElement('span');
                    periodSpan.className = 'time-period';
                    periodSpan.textContent = period;
                    return [mainSpan, periodSpan];
                },
                generateGCalLink(departureTimeStr, direction, date) {
                    const departureDate = this.createDateFromTime(departureTimeStr, date);
                    const eventStart = new Date(departureDate.getTime() - 25 * 60000);
                    const arrivalDate = new Date(departureDate.getTime() + App.TRIP_DURATION_MINUTES * 60000);
                    const eventEnd = new Date(arrivalDate.getTime() + 25 * 60000);

                    const pad = (num) => String(num).padStart(2, '0');
                    const formatDate = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
                    
                    const url = new URL('https://www.google.com/calendar/render');
                    url.searchParams.append('action', 'TEMPLATE');
                    url.searchParams.append('text', '🚴‍♂️ Commute');
                    url.searchParams.append('dates', `${formatDate(eventStart)}/${formatDate(eventEnd)}`);
                    url.searchParams.append('details', `Ferry commute: ${direction}`);
                    url.searchParams.append('trp', 'true');

                    return url.toString();
                },
            },
            
            dev: {
                toggle() { const isVisible = App.dom.devTools.style.transform === 'translateX(0px)'; if (!isVisible) this.init(); App.dom.devTools.style.transform = isVisible ? 'translateX(110%)' : 'translateX(0px)'; },
                init() { const now = new Date(); App.dom.hourSlider.value = now.getHours(); App.dom.minuteSlider.value = now.getMinutes(); App.dom.daySlider.value = 0; this.updateSliderDisplays(); },
                updateSliderDisplays() { const dayOffset = parseInt(App.dom.daySlider.value, 10); if(dayOffset === 0) App.dom.daySliderValue.textContent = 'Today'; else if(dayOffset === 1) App.dom.daySliderValue.textContent = '+1 day'; else if(dayOffset === -1) App.dom.daySliderValue.textContent = '-1 day'; else App.dom.daySliderValue.textContent = `${dayOffset > 0 ? '+' : ''}${dayOffset} days`; App.dom.hourSliderValue.textContent = String(App.dom.hourSlider.value).padStart(2, '0'); App.dom.minuteSliderValue.textContent = String(App.dom.minuteSlider.value).padStart(2, '0'); },
                handleSliderChange() { const dayOffset = parseInt(App.dom.daySlider.value, 10); const hour = parseInt(App.dom.hourSlider.value, 10); const minute = parseInt(App.dom.minuteSlider.value, 10); const simTime = new Date(); simTime.setDate(simTime.getDate() + dayOffset); simTime.setHours(hour, minute, 0, 0); App.state.simulatedTime = simTime; App.state.displayDate = new Date(simTime); this.updateSliderDisplays(); App.updateScheduleDisplay(); },
                reset() { App.state.simulatedTime = null; App.state.displayDate = new Date(); this.init(); App.updateScheduleDisplay(); },
            }
        };

        App.init();

    });
    </script>
</body>
